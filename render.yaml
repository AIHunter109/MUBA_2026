# Render blueprint for the RemitGuard backend (server/src/index.ts).
# Deploy: render.com -> New -> Blueprint -> connect this repo.
# Then set the secret env vars marked `sync: false` in the dashboard.
#
# Database is Supabase Postgres (see prisma/schema.prisma). Set DATABASE_URL to
# the transaction-mode pooler URL (port 6543, ?pgbouncer=true) and DIRECT_URL to
# the session-mode pooler URL (port 5432) - both from the Supabase project's
# Connect dialog.
services:
  - type: web
    name: remitguard-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm run server
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: DEMO_MODE
        value: "false"
      - key: SUI_NETWORK
        value: testnet
      - key: CONFIRMATION_TOKEN_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: GONKA_API_KEY
        sync: false
      - key: NEWSAPI_KEY
        sync: false
      # Optional - on-chain fact-check verdict recording. Leave unset to skip it.
      - key: FACTCHECK_PACKAGE_ID
        sync: false
      - key: FACTCHECK_SIGNER_SECRET_KEY
        sync: false
